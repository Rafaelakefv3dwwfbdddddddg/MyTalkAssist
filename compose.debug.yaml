services:
  babelplugintransformflowenums:
    image: babelplugintransformflowenums
    build:
      context: node_modules/babel-plugin-transform-flow-enums
      dockerfile: ./Dockerfile
    environment:
      NODE_ENV: development
    ports:
      - 3000:3000
      - 9229:9229
    command: ["node", "--inspect=0.0.0.0:9229", "index.js"]
